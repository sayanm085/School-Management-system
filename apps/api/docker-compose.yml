services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: baranda
      POSTGRES_PASSWORD: baranda_local
      POSTGRES_DB: baranda
    ports:
      - "5432:5432"
    volumes:
      - baranda_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baranda -d baranda"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: baranda
      MINIO_ROOT_PASSWORD: baranda_local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - baranda_minio:/data

volumes:
  baranda_pg:
  baranda_minio:
